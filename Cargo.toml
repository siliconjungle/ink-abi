[package]
license = "MIT"
name = "ink-abi"
version = "0.1.0"
edition = "2021"
repository = "https://github.com/siliconjungle/ink-abi"
[lib]
crate-type = ["rlib", "cdylib"]
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
num-bigint = "0.4"
num-traits = "0.2"
[workspace]
